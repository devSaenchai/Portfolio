<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sanjay | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fixed WebGL Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* SECTION 1: HERO CONTAINER */
    .section-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* SECTION 2: ABOUT CONTAINER */
    .section-about {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8%;
      pointer-events: none;
    }

    .about-content {
      width: 45%;
      color: #fff;
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2.5rem;
      border-radius: 16px;
    }

    .about-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.1;
    }

    .about-desc {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #ccc;
      max-width: 500px;
    }
  </style>

  <!-- Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- Persistent WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- SECTION 1 -->
  <section class="section-hero" id="hero-section"></section>

  <!-- SECTION 2 -->
  <section class="section-about">
    <div class="about-content">
      <h2 class="about-title">Crafting Digital<br/>Experiences</h2>
      <p class="about-desc">
        A software engineer focused on crafting fast, accessible, and user-centric digital products.
      </p>
    </div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Load background image
    const bgImage = new Image();
    bgImage.crossOrigin = 'anonymous';
    bgImage.src = 'me2.png';

    const bgTexture = new THREE.Texture(bgImage);
    bgImage.onload = () => {
      bgTexture.needsUpdate = true;
    };

    // Canvas Trails (Mouse Ripple on Hero)
    const trailCanvas = document.createElement('canvas');
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = window.innerHeight;
    const trailCtx = trailCanvas.getContext('2d');

    // Base Canvas ("SAENCHAI" Base)
    const topCanvas = document.createElement('canvas');
    topCanvas.width = window.innerWidth;
    topCanvas.height = window.innerHeight;
    const topCtx = topCanvas.getContext('2d');

    // UI Overlay Canvas
    const uiCanvas = document.createElement('canvas');
    uiCanvas.width = window.innerWidth;
    uiCanvas.height = window.innerHeight;
    const uiCtx = uiCanvas.getContext('2d');

    function drawLayers() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const p = 40;

      // Solid White Layer + SAENCHAI Typography
      topCtx.fillStyle = '#ffffff';
      topCtx.fillRect(0, 0, w, h);
      
      topCtx.fillStyle = '#000000';
      topCtx.font = '900 ' + (w * 0.16) + 'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      topCtx.textAlign = 'center';
      topCtx.textBaseline = 'middle';
      topCtx.fillText("SAENCHAI", w / 2, h / 2 + 30);

      // UI Overlay Layer
      uiCtx.clearRect(0, 0, w, h);
      uiCtx.fillStyle = '#000000';
      uiCtx.strokeStyle = '#000000';

      uiCtx.font = '800 24px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      uiCtx.textAlign = 'left';
      uiCtx.textBaseline = 'top';
      uiCtx.fillText("Hi, I'm Sanjay. I build things for the web.", p, p);

      uiCtx.font = '500 15px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      uiCtx.fillText("A software engineer focused on crafting fast, accessible, and user-centric digital products.", p, p + 35);

      uiCtx.font = '700 12px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      uiCtx.lineWidth = 1.5;
      uiCtx.beginPath();
      uiCtx.roundRect(p, p + 68, 210, 32, 50);
      uiCtx.stroke();
      uiCtx.fillText("CHECK OUT MY PROJECTS  →", p + 20, p + 77);

      uiCtx.textAlign = 'right';
      uiCtx.font = '800 14px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      uiCtx.fillText("MENU ::", w - p, p);

      uiCtx.font = '700 14px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
      uiCtx.textAlign = 'left';
      uiCtx.fillText("Full-stack Developer from Kerala", p, h - p - 15);

      uiCtx.textAlign = 'right';
      uiCtx.fillText("LINKEDIN   /   INSTAGRAM   [EN]", w - p, h - p - 15);
    }
    drawLayers();

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const topTexture = new THREE.CanvasTexture(topCanvas);
    const uiTexture = new THREE.CanvasTexture(uiCanvas);
    const trailTexture = new THREE.CanvasTexture(trailCanvas);
    
    trailTexture.flipY = true; 
    topTexture.flipY = true;
    uiTexture.flipY = true;
    bgTexture.flipY = true;

    trailTexture.minFilter = THREE.LinearFilter;
    trailTexture.magFilter = THREE.LinearFilter;

    // Shader with pure solid sliding logic
    const material = new THREE.ShaderMaterial({
      uniforms: {
        u_bg: { value: bgTexture },
        u_top: { value: topTexture },
        u_ui: { value: uiTexture },
        u_trail: { value: trailTexture },
        u_time: { value: 0 },
        u_zoom: { value: 1.0 },
        u_offsetX: { value: 0.0 },
        u_translateY: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D u_bg;
        uniform sampler2D u_top;
        uniform sampler2D u_ui;
        uniform sampler2D u_trail;
        uniform float u_time;
        uniform float u_zoom;
        uniform float u_offsetX;
        uniform float u_translateY;
        varying vec2 vUv;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                           -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ) );
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m;
          m = m*m;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        void main() {
          vec2 zoomedUv = (vUv - vec2(0.5 + u_offsetX, 0.5)) / u_zoom + vec2(0.5, 0.5);
          vec2 shiftedUv = vUv - vec2(0.0, u_translateY);

          vec4 bgCol = texture2D(u_bg, zoomedUv);

          if (shiftedUv.y >= 0.0 && shiftedUv.y <= 1.0) {
            vec4 topCol = texture2D(u_top, shiftedUv);
            vec4 uiCol = texture2D(u_ui, shiftedUv);

            float rawTrail = texture2D(u_trail, vUv).r;
            float rippleWave = sin(u_time * 3.0 + snoise(vUv * 8.0) * 6.28) * 0.04;
            float edgeNoise = snoise(vUv * 6.0 + u_time * 0.5) * 0.08;
            float blobVal = rawTrail + edgeNoise + rippleWave;
            float revealMask = smoothstep(0.2, 0.28, blobVal);

            vec4 unrevealed = mix(topCol, vec4(0.0, 0.0, 0.0, 1.0), uiCol.a);
            vec4 heroComposite = mix(unrevealed, bgCol, revealMask);

            if (uiCol.a > 0.1 && revealMask > 0.01) {
              heroComposite = mix(heroComposite, vec4(1.0, 1.0, 1.0, 1.0), revealMask * uiCol.a);
            }
            
            gl_FragColor = heroComposite;
          } else {
            gl_FragColor = bgCol;
          }
        }
      `
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    // GSAP ScrollTrigger Animations
    gsap.to(material.uniforms.u_translateY, {
      value: 1.0,
      ease: "none",
      scrollTrigger: {
        trigger: ".section-about",
        start: "top bottom",
        end: "top top",
        scrub: true
      }
    });

    gsap.to(material.uniforms.u_zoom, {
      value: 1.5,
      ease: "none",
      scrollTrigger: {
        trigger: ".section-about",
        start: "top bottom",
        end: "top top",
        scrub: true
      }
    });

    gsap.to(material.uniforms.u_offsetX, {
      value: 0.18,
      ease: "none",
      scrollTrigger: {
        trigger: ".section-about",
        start: "top bottom",
        end: "top top",
        scrub: true
      }
    });

    // Mouse Tracking Trail
    window.addEventListener('mousemove', (e) => {
      if (window.scrollY > window.innerHeight * 0.5) return;

      const mx = e.clientX;
      const my = e.clientY;
      const radius = 90;

      const radGrad = trailCtx.createRadialGradient(mx, my, 0, mx, my, radius);
      radGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      radGrad.addColorStop(0.6, 'rgba(255, 255, 255, 0.8)');
      radGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      trailCtx.fillStyle = radGrad;
      trailCtx.beginPath();
      trailCtx.arc(mx, my, radius, 0, Math.PI * 2);
      trailCtx.fill();
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      topCanvas.width = uiCanvas.width = trailCanvas.width = window.innerWidth;
      topCanvas.height = uiCanvas.height = trailCanvas.height = window.innerHeight;
      
      drawLayers();
      topTexture.needsUpdate = true;
      uiTexture.needsUpdate = true;
    });

    // Render loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      trailCtx.fillStyle = 'rgba(0, 0, 0, 0.025)';
      trailCtx.fillRect(0, 0, trailCanvas.width, trailCanvas.height);

      trailTexture.needsUpdate = true;
      material.uniforms.u_time.value = clock.getElapsedTime();

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
